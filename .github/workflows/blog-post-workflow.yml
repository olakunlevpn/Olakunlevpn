name: Latest blog post and agent skills workflow

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest blog posts and agent skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull in latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://olakunlevpn.github.io/feed.xml"
          max_post_count: 10

      - name: Pull latest changes
        run: git pull origin main

      - name: Update Agent Skills in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_skills.py

      - name: Commit and push if skills changed
        run: |
          git config user.name "Olakunlevpn"
          git config user.email "olakunlevpn@live.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: update agent skills list in readme"
            git push origin main
          else
            echo "No changes to agent skills."
          fi
